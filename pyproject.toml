[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "aieha"
version = "0.1.0"
description = "A transparent, graph-native framework for measuring the economics of artificial intelligence."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"

dependencies = [
    "pydantic>=2",
    "networkx>=3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"